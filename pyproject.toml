[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tritrack-audio-recorder"
version = "1.0.0"
description = "High-fidelity Windows stereo audio recorder producing 3 synchronized outputs: Microphone, System Audio (WASAPI Loopback), and Combined Mix."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26.0",
    "scipy>=1.11.0",
    "soundfile>=0.13.1",
    "PySide6>=6.6.0",
    "PyAudioWPatch>=0.2.12.6; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pyinstaller>=6.0.0",
]

[project.gui-scripts]
tritrack = "tritrack.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
