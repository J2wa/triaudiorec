name: Test & Build Windows Executable

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    name: Automated Test Suite (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ ubuntu-latest, windows-latest ]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system libsndfile (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libsndfile1

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy scipy soundfile pytest
          pip install --no-deps -e .

      - name: Run pytest
        run: pytest -v

  build-windows-exe:
    name: Build Standalone Windows .exe
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install runtime & build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -e .

      - name: Package TriTrackStudio.exe with PyInstaller
        run: |
          pyinstaller --noconfirm --clean --windowed --onefile `
            --name "TriTrackStudio" `
            --paths src `
            --collect-all soundfile `
            --collect-all _soundfile_data `
            --hidden-import pyaudiowpatch `
            src/tritrack/__main__.py

      - name: Upload Windows executable artifact
        uses: actions/upload-artifact@v4
        with:
          name: TriTrackStudio-windows-x64
          path: dist/TriTrackStudio.exe
          retention-days: 30
